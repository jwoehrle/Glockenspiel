<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mein Glockenspiel</title>
    <meta name="description" content="Glockenspiel-Lieder lernen mit Farben und Mikrofon" />
    <meta name="theme-color" content="#FBF6EE" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Glockenspiel" />
  </head>
  <body class="home">
    <!-- Language switcher: the flag of the selected language; the option names are accessible labels. -->
    <select class="lang" id="lang" data-i18n-label="lang.label" data-i18n-title="lang.label">
      <option value="en" aria-label="English">🇬🇧</option>
      <option value="de" aria-label="Deutsch">🇩🇪</option>
    </select>
    <button
      class="gear"
      id="settingsBtn"
      data-i18n-title="gear.title"
      data-i18n-label="gear.label"
      title="Parent area (press and hold)"
      aria-label="Parent area"
    >
      ⚙️
    </button>
    <div class="gearhint" id="gearhint" role="status" data-i18n="gear.hint" hidden>
      ⚙ Press and hold to open
    </div>
    <h1 id="title">🎵 My Glockenspiel</h1>
    <div class="songs" id="songs"></div>

    <div class="stage">
      <div class="big" id="big" data-i18n-title="big.title" title="Tap = next"></div>
      <!-- Staff notation (parent option; left of the circle on tablets and laptops, hidden on phones) -->
      <div class="staff idle" id="staff" role="img"></div>
      <div class="colname" id="colname"></div>
      <div class="syl" id="syl"></div>
      <!-- Whole glockenspiel with the bar to strike popping out (tablet portrait: below the circle; landscape: beside it; see style.css) -->
      <div class="instrument" id="instrument" role="group" aria-label="Glockenspiel"></div>
      <div class="next" id="next"></div>
      <div class="hint" id="hint"></div>
      <button class="calcancel" id="calcancel" data-i18n="cal.cancel">✖ Cancel calibration</button>
      <div class="sparks" id="sparks"></div>
      <div class="done-box" id="done">
        <div class="yay">🎉⭐🎉</div>
        <p data-i18n="done.text">Well done!</p>
        <button id="again" class="again" data-i18n="done.again">🔁 Again!</button>
      </div>
    </div>

    <div class="track" id="track"></div>

    <!-- Playback rows right below the track (landscape: beside the other controls, see style.css) -->
    <div class="dock">
      <div class="playback">
        <div class="playrow">
          <button id="playsong" title="Play the whole song" aria-label="Play the whole song">▶</button>
        </div>
        <div class="speed" role="group" data-i18n-label="speed.group" aria-label="Speed">
          <button
            id="slower"
            data-i18n-title="speed.slower"
            data-i18n-label="speed.slower"
            title="Slower"
            aria-label="Slower"
          >
            🐌
          </button>
          <button
            id="speed"
            data-i18n-title="speed.normal"
            data-i18n-label="speed.normal"
            title="Normal speed"
            aria-label="Normal speed"
          >
            1×
          </button>
          <button
            id="faster"
            data-i18n-title="speed.faster"
            data-i18n-label="speed.faster"
            title="Faster"
            aria-label="Faster"
          >
            🏎️
          </button>
        </div>
      </div>
      <div class="controls">
        <button
          id="home"
          data-i18n-title="ctl.home"
          data-i18n-label="ctl.home"
          title="Songs"
          aria-label="Songs"
        >
          🏠
        </button>
        <button
          id="mic"
          class="primary"
          data-i18n-title="ctl.mic"
          data-i18n-label="ctl.mic"
          title="Listen"
          aria-label="Listen"
        >
          🎤
        </button>
        <button
          id="play"
          data-i18n-title="ctl.play"
          data-i18n-label="ctl.play"
          title="Play note"
          aria-label="Play note"
        >
          🔊
        </button>
        <button id="restart" class="restart" data-i18n="ctl.restart">🔁 Restart</button>
      </div>
    </div>

    <div class="meter" id="meter"><i id="lvl"></i></div>

    <dialog id="settings">
      <h2 data-i18n="set.title">⚙️ Parent area</h2>
      <label class="opt"
        ><input type="checkbox" id="optAuto" />
        <span data-i18n="set.auto">Play the tone automatically</span></label
      >
      <label class="opt"
        ><input type="checkbox" id="optSpeak" />
        <span data-i18n="set.speak">Read the color aloud</span></label
      >
      <label class="opt"
        ><input type="checkbox" id="optStaff" /> <span data-i18n="set.staff">Show staff notation</span></label
      >
      <label class="opt"
        ><span data-i18n="set.sens">Sensitivity</span>
        <input type="range" id="sens" min="1" max="10" value="6"
      /></label>
      <button id="back" data-i18n="set.back">⬅️ One note back</button>
      <button id="cal">🎯 Calibrate</button>
      <p class="st" id="calState"></p>
      <button id="calreset" data-i18n="set.calReset">🗑 Delete calibration</button>
      <button id="clearall" data-i18n="set.clearAll">🧹 Delete all saved data</button>
      <p class="st" id="setMsg"></p>
      <button id="setClose" class="primary" data-i18n="set.close">Close</button>
    </dialog>

    <footer id="foot"></footer>
    <div class="preview" id="preview" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
